<text x="388" y="292" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start">Agent-type gate (hook)</text>
<text x="388" y="316" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">blocks general-purpose / Explore / fork</text>
<text x="388" y="336" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">enforces the model from the agent file</text>
<circle cx="330" cy="264" r="13" fill="#D97757"/>
