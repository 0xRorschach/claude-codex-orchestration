<text x="302" y="171" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">Codex: Astra · high</text>
<text x="286" y="193" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">plan · decide · brief · review · synthesize</text>
<text x="286" y="215" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">does no hands-on work</text>
<circle cx="270" cy="95" r="13" fill="#D97757"/>
<text x="270" y="100" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">2</text>
