<text x="902" y="736" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">Claude sessions only</text>
<text x="886" y="758" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">consulted before “done”</text>
