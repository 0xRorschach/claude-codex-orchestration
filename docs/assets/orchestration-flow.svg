<text x="56" y="892" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start">User</text>
<text x="56" y="918" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">gets the result</text>
<rect x="960" y="838" width="200" height="108" rx="10" fill="#FFFFFF" stroke="#57606A" stroke-width="1.6" stroke-dasharray="6 5"/>
