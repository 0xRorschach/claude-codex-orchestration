<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', 'Liberation Sans', sans-serif">
<title id="t">Claude Code + Codex orchestration flow</title>
<desc id="d">User gives a task to the main session, which briefs parallel subagents through an agent-type gate; subagents return evidence; K1 same-family review, K2 cross-family critic and the advisor check the work; the main session synthesizes the answer for the user. Irreversible actions need user approval.</desc>
