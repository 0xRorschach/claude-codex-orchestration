<text x="976" y="892" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">irreversible actions</text>
<text x="976" y="912" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">(push, publish)</text>
<text x="976" y="932" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">→ user approval</text>
