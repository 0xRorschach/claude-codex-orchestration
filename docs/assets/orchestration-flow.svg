<circle cx="421" cy="731" r="5" fill="#0E8A6E"/>
<text x="432" y="736" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">Claude session → Codex</text>
<text x="416" y="758" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">Sol at task boundary, Astra at branch end</text>
<circle cx="421" cy="773" r="5" fill="#D97757"/>
<text x="432" y="778" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">Codex session → Claude Opus</text>
<text x="416" y="800" font-size="14" font-weight="400" fill="#57606A" text-anchor="start">“find the weakest point; if none, say none”</text>
<circle cx="400" cy="682" r="13" fill="#D97757"/>
<text x="400" y="687" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">7</text>
