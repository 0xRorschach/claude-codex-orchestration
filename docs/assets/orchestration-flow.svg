<text x="56" y="736" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">fresh explorer per task</text>
<text x="56" y="758" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">checks spec + quality</text>
<circle cx="40" cy="682" r="13" fill="#D97757"/>
