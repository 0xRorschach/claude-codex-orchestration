<text x="40" y="46" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Claude Code + Codex orchestration flow</text>
<text x="40" y="72" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">The main session plans, briefs and reviews; subagents do the work and return evidence.</text>
