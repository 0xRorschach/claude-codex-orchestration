<text x="892" y="171" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">Codex family (Astra, Sol)</text>
<text x="876" y="193" font-size="15" font-weight="400" fill="#1F2328" text-anchor="start">lit card = current step</text>
<text x="876" y="215" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">faded card = step done</text>
